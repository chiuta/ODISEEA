<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODISEEA · Galerie surse</title>
<style>body{background:#0b0d14;color:#dde;font:14px system-ui;margin:0;padding:12px}h2{margin:18px 0 6px;color:#8cf}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.c{background:#151926;border-radius:6px;overflow:hidden;font-size:11px}.c img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.c a{color:#adf;text-decoration:none;display:block;padding:4px}.v{outline:2px solid #fa4}#st{position:sticky;top:0;background:#0b0d14;padding:6px 0}</style>
<div id="st">Se încarcă… <b id="n">0</b> elemente <label><input type="checkbox" id="cm" checked> include Wikimedia Commons</label></div><div id="o"></div>
<script>
const S=[["Lansare","Voyager 2 launch Titan Centaur|Voyager launch Cape Canaveral 1977",/voyager|titan|launch/i],["Traiectorie","Voyager grand tour trajectory|Voyager mission trajectory planets",/voyager|trajectory|grand tour/i],["Jupiter","Voyager 1 Jupiter|Voyager 2 Jupiter Great Red Spot",/voyager|jupiter/i],["Io / Europa","Voyager Io volcanic plume|Voyager Europa",/\bio\b|europa|volcan/i],["Saturn","Voyager Saturn rings|Voyager 2 Saturn",/voyager|saturn/i],["Titan","Voyager Titan atmosphere",/titan/i],["Uranus","Voyager 2 Uranus|Voyager 2 Miranda",/uranus|miranda/i],["Neptun","Voyager 2 Neptune Great Dark Spot|Voyager 2 Triton",/neptune|triton/i],["Pale Blue Dot","Pale Blue Dot Voyager",/pale blue dot|earth/i],["Portret de familie","Solar System family portrait Voyager 1 mosaic",/family|portrait|mosaic|solar system/i],["Discul de aur","Voyager Golden Record|Voyager Golden Record cover",/record|golden/i],["Coperta discului","Golden Record cover diagram pulsar map",/record|golden|pulsar/i],["Heliopauză","Voyager heliosphere heliopause interstellar|Voyager interstellar space",/voyager|heliosphere|heliopause|interstellar/i],["Energie","Voyager spacecraft RTG instruments|Voyager spacecraft diagram",/voyager/i],["DSN","Deep Space Network antenna|Deep Space Network Canberra Goldstone",/deep space network|dsn|antenna/i],["Distanță","Voyager 1 interstellar distance",/voyager/i],["Viitor","Voyager interstellar artist concept|Voyager spacecraft stars",/voyager/i],["Final","Voyager 2 spacecraft",/voyager/i]];
const o=document.getElementById("o"),nEl=document.getElementById("n");let n=0;const seen=new Set();
function add(g,h,src,t,url,vid){if(seen.has(src+t))return;seen.add(src+t);const c=document.createElement("div");c.className="c"+(vid?" v":"");c.innerHTML='<a target=_blank rel=noopener href="'+url+'"><img loading=lazy src="'+h+'" alt=""><span>'+(vid?"▶ VIDEO · ":"")+t.replace(/</g,"&lt;").slice(0,90)+'</span></a>';g.appendChild(c);nEl.textContent=++n;}
async function J(u){const r=await fetch(u);return r.json();}
async function nasa(g,q,m,kind,pages){for(let p=1;p<=pages;p++){try{const j=await J("https://images-api.nasa.gov/search?media_type="+kind+"&page_size=100&page="+p+"&q="+encodeURIComponent(q));const it=j.collection.items;for(const x of it){const d=x.data[0],l=x.links&&x.links[0];if(!l||!m.test(d.title+" "+(d.description||"")+" "+(d.keywords||[]).join(" ")))continue;add(g,l.href,"N",d.title,"https://images.nasa.gov/details/"+encodeURIComponent(d.nasa_id),kind==="video");}if(it.length<100)break;}catch(e){break;}}}
async function com(g,q,m){try{const j=await J("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=300");for(const p of Object.values((j.query||{}).pages||{})){const i=p.imageinfo&&p.imageinfo[0];if(!i||!/jpeg|png/.test(i.mime)||!m.test(p.title))continue;const l=(i.extmetadata&&i.extmetadata.LicenseShortName&&i.extmetadata.LicenseShortName.value)||"";if(!/public domain|pd|cc0/i.test(l))continue;add(g,i.thumburl,"C",p.title.replace(/^File:/,""),i.descriptionurl);}}catch(e){}}
(async()=>{for(const [lab,qs,m] of S){const h=document.createElement("h2");h.textContent=lab;const g=document.createElement("div");g.className="g";o.append(h,g);
 for(const q of qs.split("|")){await Promise.all([nasa(g,q,m,"image",3),nasa(g,q,m,"video",1),document.getElementById("cm").checked?com(g,q,m):0]);}}
 document.getElementById("st").firstChild.textContent="Gata. ";})();
</script></html>
